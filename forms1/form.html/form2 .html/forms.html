<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <fieldset>
    
    <form><h2> Event Register</h2>
        <label for="name"> Name:</label><br><br>
        <input type="text" id="name" name="name"><br>

        <label for="email"> Email:</label><br><br>
        <input type="text" id="email" name="email"><br>

        <label for="Phone"> phone no : </label><br><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="occupied"> Occupation:</label><br>
        <select name="Occupation" id="occupied"><br>
            <option value="Student">Student</option>
            <option value="Professional">Professional</option>
            <option value="Other">Other</option>
        </select>
        <fieldset>
            <legend>Types of interest</legend>

            <label for="html"> Html</label><br>
        <input type="checkbox" id="html" name="html"><br>

         <label for="CSS"> CSS</label><br>
        <input type="checkbox" id="CSS" name="CSS"><br>

         <label for="JavaScript"> JavaScript</label><br>
        <input type="checkbox" id="JavaScript" name="JavaScript"><br>

        </fieldset><br> <br>

        <label for="comment" > Comments: </label><br>
        <textarea name="comment" id="comment" rows="5" cols="100"></textarea>
         
        <input type="submit" id="submit" value="Register">




    </form>
    </fieldset>
</body>
</html>
