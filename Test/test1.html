<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
            box-shadow:inset;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            min-height: 90vh;
            margin: 30px auto;
            border: 2px solid #333;
            border-radius: 10px;
        }

        .navbar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 20px 30px;
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="navbar">

            <div class="logo">
                My Website
            </div>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
            </div>

        </div>

        <div class="content">
            <h1>Welcome!</h1>
            <p>Your content goes here.</p>
        </div>

    </div>

</body>
</html>
