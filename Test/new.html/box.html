<!DOCTYPE html>                                                                                              
    <html lang="en">                                                                                             
    <head>                                                                                                       
        <meta charset="UTF-8">                                                                                   
        <meta name="viewport" content="width=device-width, initial-scale=1.0">                                   
        <title>Revision</title>                                                                                  
        <style>                                                                                                  
              .big {                                                                                                   
        width: 500px;                                                                                            
        height: 400px;                                                                                           
        background-color: darkblue;                                                                                  
        position: relative;                                                                                      
        border-radius: 20px;                                                                                     
        overflow: hidden;                                                                                      
    }                                                                                                            
                                                                                                                 
    .small {                                                                                                 
        width: 200px;                                                                                            
        height: 200px;                                                                                           
        background-color: darkgreen;                                                                                 
        position: absolute; 
        bottom: 0;                                                                                                                                                                                     
        border-radius: 20px                                                                                     
    }                                                                                                            

    .main {
        position: absolute;
        top: 15px;
        right: 20px;
        color: white;
        font-size: 18px;
        font-family: sans-serif;
    }
        </style>
    </head>
    <body>
        <div class="big">
            <span class="main">Div1</span>
            <div class="small">
                <span class="main">Div2</span>
            </div>
        </div>
    </body>
    </html>
