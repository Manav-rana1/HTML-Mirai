<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width ,  initial-scale=1.0">
        <title>hiee</title>
        <style>
            *{
                margin: 0;
                padding :0;
                box-sizing: border-box;
            }
            .manav{
                border:2px solid red;
                border-radius: 4px;
                height: 700px;
                width: 650px;
            }
            .avi{
                background-color: aqua;
                display: flex;
                justify-content: space-between;
                align-items: centre;
                padding:10px 20px;


            }
            .bhupu{
                display:flex;
                gap:10px;
                list-style:none;
            }
            .bhupe a{
                text-decoration: none;
                color: black;
            }
            .ontop{
                justify-content: space-between;
                display: flex;
            }
            .man{
                border:2px solid red;
                height:100px;
                width:70px;
                margin:30px;
                background-color: blue;
                justify-content: space-between;
                display: flex;
                align-items: center;

            }

        </style>
    </head>
    <body>
        <div class="manav">
            <nav class="avi">
                <h2> Manav Rana</h2>
                <ul class="bhupu">
                    <li><a href="#">link 1</a></li>
                    <li><a href="#">link 2 </a></li>
                    <li><a href="#">link 3</a></li>
                </ul>
            </nav>
            <div class="ontop">
                <div class="man">Box 1</div>
                <div class="man">Box 2</div>
                <div class="man">Box 3</div>
                <div class="man">Box 4</div>
            </div>
        </div>
    </body>
</html>
