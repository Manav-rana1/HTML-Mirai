<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }
        #div1{
            transition-timing-function: linear;
        }
       
        
        div{
           width: 200px;
           height: 200px;
           background-color: yellowgreen;
           transition: width 2s, height 2s , background-color 2s, transform 2s , border-radius 2s;
           display:grid;
           place-items: center;
           margin: 10px;
        }
        div:hover{
            width:400px;
            height:400px;
            background-color:orange;
            transform: rotate(7200deg) translate(600px,200px);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div id="div 1"> linear</div>
</body>
</html>
