<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }
        div{
           width: 100px;
           height: 100px;
           background-color: yellowgreen;
           transition: width 2s, height 2s , background-color 2s;
           display:grid;
           place-items: center;
        }
        div:hover{
            width:300px;
            height:200px;
            background-color:orange;
        }
    </style>
</head>
<body>
    <div> </div>
</body>
</html>
