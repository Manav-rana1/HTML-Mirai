<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 300px;
  height: 300px;
  background-color: red;
  animation-name: m123;
  animation-duration: 4s;
}

@keyframes m123 {
  from {background-color: blue;}
  to {background-color: yellow;}
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<div></div>


</body>
</html>
